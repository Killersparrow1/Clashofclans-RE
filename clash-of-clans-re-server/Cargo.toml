[package]
name = "clash-of-clans-re-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Clash of Clans private server: async TCP gateway, sessions, SQLite persistence"
keywords = ["clash-of-clans", "protocol", "reverse-engineering", "game-server", "server"]
categories = ["network-programming", "game-development"]

[dependencies]
clash-of-clans-re-protocol = { path = "../clash-of-clans-re-protocol" }
tokio = { workspace = true }
bytes = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }
dashmap = { workspace = true }
hex = { workspace = true }
sodiumoxide = { workspace = true }