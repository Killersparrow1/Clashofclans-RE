name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsodium-dev pkg-config

      - name: Run tests
        run: cargo test --workspace

      - name: Run clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Check formatting
        run: cargo fmt --check --workspace

      - name: Security audit
        run: |
          cargo install cargo-audit --locked
          cargo audit --deny warnings

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo doc --workspace --no-deps
      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs
          path: target/doc

  build:
    name: Build Binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libsodium-dev pkg-config
      - run: cargo build --release --workspace
      - name: Upload server binary
        uses: actions/upload-artifact@v4
        with:
          name: clash-of-clans-re-server
          path: target/release/clash-of-clans-re-server
      - name: Upload client test binary
        uses: actions/upload-artifact@v4
        with:
          name: clash-of-clans-re-client-test
          path: target/release/clash-of-clans-re-client-test